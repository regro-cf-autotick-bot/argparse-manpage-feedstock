{% set name = "argparse-manpage" %}
{% set version = "4.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d55ce1c246479ddd82871170a8cc543a6831bb68c87a298e47f0663a9330b74f

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - argparse-manpage = argparse_manpage.cli:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}
    - tomli

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - argparse_manpage
    - build_manpages
  commands:
    # check metadata
    - python -m pip check argparse-manpage
    - python -m pip show argparse-manpage
    # check entry points
    - argparse-manpage --help

about:
  home: https://github.com/praiskup/argparse-manpage
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Build manual page from python's ArgumentParser object.

extra:
  recipe-maintainers:
    - duncanmmacleod
